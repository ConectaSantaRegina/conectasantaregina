<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conecta Santa Regina — o guia do nosso bairro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f9f4e6;--card:#fff;--ink:#142920;--mut:#5a6e65;--pri:#00765c;--pri-i:#fff;--acc:#fba537;--acc-i:#3e2104;--ln:#e5e7db;--bad:#b3372f;--ok:#00765c;--hd:#fdfaf1;--mint:#c9f4db;--mint-i:#143b2e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Georgia,serif;line-height:1.15;letter-spacing:-.02em;margin:0 0 .4em}
h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:800}h2{font-size:1.6rem}
a{color:var(--pri)}:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.w{max-width:1340px;margin:auto;padding:0 16px}section.w{padding-top:28px;padding-bottom:12px}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hd);color:var(--ink);border-bottom:1px solid var(--ln)}#top a{color:inherit}#top .b.a{color:var(--acc-i)}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding-top:10px;padding-bottom:6px}
.brand{text-decoration:none;display:flex;align-items:center;gap:10px}.brand div{display:flex;flex-direction:column;line-height:1.2}.brand b{font:800 1.1rem 'Bricolage Grotesque',serif}.brand span{font-size:.8rem;color:var(--mut)}.lg{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--pri);flex:none}
.acc{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#top nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px}#top nav a{white-space:nowrap;padding:6px 12px;border-radius:999px;text-decoration:none;font-size:.92rem;font-weight:600;color:var(--mut)}#top nav a[aria-current]{background:var(--mint);color:var(--mint-i)}
.b{border:0;border-radius:999px;padding:.6em 1.2em;font:600 1rem Figtree,sans-serif;cursor:pointer;background:var(--pri);color:var(--pri-i)}a.b{text-decoration:none;display:inline-block}
.b.s{background:none;color:var(--pri);border:2px solid var(--pri)}.b.a{background:var(--acc);color:#2a1d00}.b.d{background:var(--bad);color:#fff}
.g{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(0,0,0,.1)}
.pw{display:block;width:100%;padding:0;border:0;background:rgba(0,0,0,.06);cursor:zoom-in}.pic{display:block;margin:auto;max-width:100%;max-height:460px;object-fit:contain}
.cb{padding:14px 16px}.cb h3{font-size:1.15rem}.cb p{margin:.2em 0;white-space:pre-line}.mut{color:var(--mut)}
.tile{display:block;padding:16px;background:var(--card);border:1px solid var(--ln);border-left:6px solid var(--acc);border-radius:10px;text-decoration:none;color:var(--ink)}.tile b{display:block;font:700 1.1rem 'Bricolage Grotesque',serif}.tile span{color:var(--mut);font-size:.92rem}
.note{background:color-mix(in srgb,var(--acc) 22%,var(--card));border-radius:10px;padding:10px 14px;margin:12px 0}
.cta{text-align:center;background:var(--card);border-radius:14px;margin-top:24px}
label{display:block;margin:10px 0;font-weight:600}input,textarea,select{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:inherit;font:inherit}
.box,.car{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:20px}form.box{max-width:560px}
.auth{display:grid;gap:20px;grid-template-columns:1fr 1fr}@media(max-width:760px){.auth{grid-template-columns:1fr}}
.car img{width:100%;object-fit:contain}.car{overflow:visible;display:grid;grid-auto-flow:column;gap:16px;scrollbar-width:none}.dots{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--ln)}.dots i.on{background:var(--pri)}.dots button{border:0;background:none;font-size:1.7rem;color:var(--pri);cursor:pointer}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tabs button{flex:1;padding:8px 14px;border:2px solid var(--pri);background:none;color:var(--pri);border-radius:999px;font:600 1rem Figtree,sans-serif;cursor:pointer}.tabs [aria-pressed="true"]{background:var(--pri);color:var(--pri-i)}
.row,.row2{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:12px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center}.row .card,.row2 .card{flex:1 1 280px;margin:0}.rb{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.tag{padding:2px 10px;border-radius:999px;font-size:.85rem;font-weight:600}.tag.p{background:var(--acc);color:#2a1d00}.tag.o{background:var(--ok);color:var(--pri-i)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid var(--ln);text-align:left;font-size:.92rem}
.pwd{position:relative;display:block;margin-top:4px}.pwd input{margin-top:0;padding-right:48px}.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:8px;background:none;color:var(--mut);cursor:pointer}.eye:hover{color:var(--ink)}.eye .sl{display:none}.eye.on .sl{display:block}
dialog{border:0;border-radius:16px;width:min(560px,94vw);max-height:92vh;background:var(--card);color:var(--ink);padding:0}dialog::backdrop{background:rgba(0,0,0,.6)}.mp{padding:20px}
dialog.z{background:none;width:auto;max-width:96vw;overflow:visible}dialog.z .mp{padding:0}dialog.z img{display:block;max-width:96vw;max-height:92vh;object-fit:contain;cursor:zoom-out}dialog.z::backdrop{background:rgba(0,0,0,.88)}.carousel-wrapper{position:relative;width:100%;background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--ln);display:flex;align-items:stretch;height:320px;transition:opacity .15s ease-in-out}.carousel-image-side{flex:0 0 55%;position:relative;overflow:hidden}.carousel-image{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease-in-out}.carousel-dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:3;background:rgba(0,0,0,.3);padding:8px 12px;border-radius:999px}.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.6);cursor:pointer;transition:all .3s;border:0}.dot.active{background:#fff;width:11px}.carousel-info{flex:1;padding:24px;display:flex;flex-direction:column;justify-content:space-between;background:var(--card);cursor:pointer}.carousel-info h3{margin:0 0 10px;font-size:1.2rem;line-height:1.3;color:var(--ink);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.carousel-info p{margin:0;font-size:.9rem;color:var(--mut);line-height:1.5;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;flex:1}.carousel-info small{color:var(--mut);display:block;font-size:.85rem}.carousel-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.35);border:0;color:#fff;font-size:1.5rem;cursor:pointer;z-index:3;display:flex;align-items:center;justify-content:center;transition:background .2s}.carousel-nav:hover{background:rgba(0,0,0,.55)}.carousel-nav.prev{left:12px}.carousel-nav.next{right:12px}.category-tag{display:inline-block;background:var(--acc);color:var(--acc-i);font-weight:600;font-size:.8rem;padding:4px 12px;border-radius:6px;margin-bottom:12px;width:fit-content}
.cl{position:fixed;top:12px;right:16px;font-size:2rem;line-height:1;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:50%;width:44px;height:44px;cursor:pointer}
.qr{display:grid;place-items:center;text-align:center;width:190px;height:190px;margin:12px auto;border:2px dashed var(--ln);border-radius:12px;color:var(--mut)}.qr img{width:100%;height:100%;object-fit:contain}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:99;max-width:92vw}#toast[hidden]{display:none}
footer{margin-top:40px;padding-top:24px;padding-bottom:24px;color:var(--mut);font-size:.9rem}
@media(max-width:900px){.carousel-wrapper{height:auto;flex-direction:column}.carousel-image-side{flex:0 0 auto;height:200px}.carousel-info{flex:0 0 auto}}
@media(max-width:640px){.auth{grid-template-columns:1fr}.g{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}}
</style>
</head>
<body>

<header id="top">
  <div class="w">
    <div class="bar">
      <a class="brand" href="#/">
        <div class="lg">📍</div>
        <div><b>Conecta Santa Regina</b><span>O ponto de encontro do nosso bairro</span></div>
      </a>
      <div class="acc">
        <button class="b s" id="ent" data-a="ent">Entrar</button>
        <button class="b a" id="pub" data-a="pub" hidden>+ Publicar</button>
        <button class="b" id="adm" data-a="adm" hidden>Admin</button>
        <button class="b s" id="sai" data-a="sai" hidden>Sair</button>
      </div>
    </div>
    <nav id="tabs"></nav>
  </div>
</header>

<main id="main"></main>

<footer class="w">
  <strong>Conecta Santa Regina</strong><br>
  Um espaço feito por moradores, para moradores. Feito com carinho pelo bairro Santa Regina.<br>
  <strong>Contatos:</strong> WhatsApp <a href="https://wa.me/5547992928049">47 99292-8049</a> | E-mail <a href="mailto:conectasantaregina@gmail.com">conectasantaregina@gmail.com</a>
</footer>

<dialog id="dlg"><div class="mp"></div></dialog>
<div id="toast" hidden></div>

<script>
const ADMIN='conectasantaregina@gmail.com';
const SUPABASE_URL=window.location.origin.includes('localhost')?'http://localhost:54321':'https://thtkyyvogoguktfvxclc.supabase.co';
const SUPABASE_KEY=new URL(window.location).searchParams.get('key')||'sb_publishable_JoBreJQq8me8WBC1R05F4w_R0nzo9jtGdvDlKtN7sB2CIMKK34i';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let D={u:[],i:[],m:[],r:[],s:null};let tab='',at='',si=0;
const $=q=>document.querySelector(q);const $$=q=>document.querySelectorAll(q);const fd=t=>new Date(t).toLocaleDateString('pt-BR');const uid=()=>Math.random().toString(36).substr(2,9);const toast=x=>{const e=$('#toast');e.textContent=x;e.hidden=false;setTimeout(()=>e.hidden=true,3000)};const wa=(t,m)=>`https://wa.me/${t?.replace(/\D/g,'')}?text=${encodeURIComponent(m)}`;const to=h=>window.location.hash=h;const dlg=$('#dlg');
async function hs(p){const e=new TextEncoder();const h=await crypto.subtle.digest('SHA-256',e.encode(p));return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('')}
function save(){localStorage.setItem('csr-demo',JSON.stringify(D))}
function load(){try{D=JSON.parse(localStorage.getItem('csr-demo'))||D}catch(e){console.error('Load error:',e)}}
async function loadFromSupabase(){try{const [u,i,m,r]=await Promise.all([supabase.from('usuarios').select('*'),supabase.from('publicacoes').select('*'),supabase.from('mensagens').select('*'),supabase.from('solicitar_premium').select('*')]);if(u.data)D.u=u.data.map(x=>({id:x.id,nome:x.nome,email:x.email,tel:x.contato,senha:x.senha,ate:new Date(x.premium_ate).getTime()||0,bl:x.bloqueado?1:0,role:x.email===ADMIN?'admin':'user'}));if(i.data)D.i=i.data.map(x=>({id:x.id,cat:x.categoria,uid:x.usuario_id,t:x.titulo,x:x.descricao,e:x.link,img:x.foto,w:new Date(x.criado_em).getTime()||0,exp:new Date(x.expira_em).getTime()||0,st:x.status==='pendente'?'p':x.status==='recusado'?'r':'o',w:x.peso||0}));if(m.data)D.m=m.data.map(x=>({id:x.id,nome:x.nome,email:x.contato,x:x.mensagem,w:new Date(x.criado_em).getTime()||0}));if(r.data)D.r=r.data.map(x=>({id:x.id,uid:x.usuario_id,nome:x.nome||'',contato:x.contato||'',m:x.meses||1,st:x.status==='pendente'?'p':'o',w:new Date(x.criado_em).getTime()||0}));}catch(e){console.warn('Supabase load failed, using localStorage:',e);load()}}
async function saveToSupabase(type,action,data){try{if(type==='usuarios'&&action==='insert'){await supabase.from('usuarios').insert({id:data.id,nome:data.nome,email:data.email,contato:data.tel,senha:data.senha,bloqueado:data.bl||false})}else if(type==='publicacoes'&&action==='insert'){await supabase.from('publicacoes').insert({id:data.id,categoria:data.cat,usuario_id:data.uid,titulo:data.t,descricao:data.x,link:data.e,foto:data.img,status:data.st==='o'?'aprovado':'pendente',duracao:data.duracao,expira_em:new Date(data.exp),peso:data.w})}else if(type==='publicacoes'&&action==='update'){await supabase.from('publicacoes').update({status:data.st==='o'?'aprovado':'pendente',duracao:data.duracao,expira_em:new Date(data.exp)}).eq('id',data.id)}else if(type==='solicitar_premium'&&action==='insert'){await supabase.from('solicitar_premium').insert({id:data.id,usuario_id:data.uid,meses:data.m,status:data.st==='o'?'aprovado':'pendente'})}}catch(e){console.warn('Supabase save failed:',e)}save()}
const me=()=>D.s?D.u.find(a=>a.id===D.s):null;const isAdm=u=>u?.role==='admin'||u?.email===ADMIN;const ok=cat=>D.i.filter(a=>a.cat===cat&&a.st==='o'&&(!a.exp||a.exp>Date.now())).sort((a,b)=>b.w-a.w);const cats={inicio:'Início',comercio:'Comércio e Serviços',saude:'Serviços Públicos',empregos:'Empregos',imoveis:'Aluguel e Venda',novidades:'Novidades',melhorias:'Propor Melhorias',acoes:'Doações e Ações',contato:'Fale Conosco',entrar:'Entrar',minhas:'Minhas Publicações',admin:'Admin'};
function renderCard(i){const cat=cats[i.cat]||i.cat;return `<button class="card" data-a="viz" data-id="${i.id}"><img src="${i.img||'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22%3E%3Crect fill=%22%23e5e7db%22 width=%22200%22 height=%22200%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2216%22 fill=%22%235a6e65%22%3ESem imagem%3C/text%3E%3C/svg%3E'}" class="pic"><div class="cb"><h3>${i.t}</h3><p>${i.x}</p><small class="mut">${isAdm(me())?`Status: ${i.st==='o'?'Publicado':i.st==='p'?'Pendente':'Recusado'}`:''}${i.exp?` • Expira ${fd(i.exp)}`:''}${i.e?` • <a href="${i.e}" target="_blank">Saiba mais</a>`:''}</small></div></button>`}
async function openPost(cat,id=null){const post=id?D.i.find(a=>a.id===id):null;const dias=cat==='novidades'?[1,3,7]:cat==='feed'?[5,10,30]:null;dlg.querySelector('.mp').innerHTML=`<form data-f="post"><h2>${id?'Editar':'Publicar em '+cats[cat]}</h2>${post&&!isAdm(me())?'<p style="color:var(--bad)">Ao editar, a publicação volta para revisão do administrador.</p>':''}<label>Título <input name="t" value="${post?.t||''}" required></label><label>Descrição <textarea name="x" rows="3" required>${post?.x||''}</textarea></label><label>Link (opcional) <input name="e" value="${post?.e||''}" placeholder="https://..."></label>${dias?`<label>Duração <select name="dias" required><option value="">Escolha...</option>${dias.map(d=>`<option value="${d}" ${post&&post.duracao===d?'selected':''}>${d} dia${d>1?'s':''}</option>`).join('')}</select></label>`:''}<input name="id" value="${id||''}" hidden><input name="cat" value="${cat}" hidden><button class="b a">Publicar</button></form>`;dlg.showModal()}
async function view(){const u=me();const r=$('#main');const tpath=window.location.hash.slice(1)||'/';const [route,...args]=tpath.split('/').filter(Boolean);await loadFromSupabase();$('header nav').innerHTML=Object.entries(cats).map(([k,v])=>`<a href="#/${k}" ${route===k?'aria-current="page"':''}>${v}</a>`).join('');$('#ent').hidden=!!u;$('#pub').hidden=!u||!u.role==='admin'&&!new Date(u.ate||0).getTime()>Date.now();$('#adm').hidden=!isAdm(u);$('#sai').hidden=!u;r.innerHTML='';if(route==='entrar'||!route){if(u)return to('/');r.innerHTML=`<section class="w"><div class="auth"><form class="box" data-f="in"><h2>Entrar</h2><label>E-mail <input name="email" type="email" required></label><div class="pwd"><input name="senha" type="password" required><button class="eye" type="button" data-toggle="senha">👁️<span class="sl">🙈</span></button></div><button class="b a">Entrar</button></form><form class="box" data-f="up"><h2>Criar conta</h2><label>Nome <input name="nome" required></label><label>WhatsApp <input name="tel" type="tel" placeholder="47 99999-9999"></label><label>E-mail <input name="email" type="email" required></label><div class="pwd"><input name="senha" type="password" required><button class="eye" type="button" data-toggle="senha">👁️<span class="sl">🙈</span></button></div><button class="b a">Criar conta</button></form></div></section>`;}else if(route==='admin'&&isAdm(u)){const pend=D.i.filter(a=>a.st==='p');const reqs=D.r.filter(a=>a.st==='p');r.innerHTML=`<section class="w"><h2>Painel Admin</h2><div class="tabs"><button aria-pressed="${at==='pubs'}" data-a="tab" data-t="pubs">Publicações (${pend.length})</button><button aria-pressed="${at==='prem'}" data-a="tab" data-t="prem">Premium (${reqs.length})</button><button aria-pressed="${at==='users'}" data-a="tab" data-t="users">Usuários</button><button aria-pressed="${at==='msgs'}" data-a="tab" data-t="msgs">Mensagens</button></div><div id="content"></div></section>`;at=at||'pubs';const c=$('#content');if(at==='pubs'){c.innerHTML=pend.map(i=>`<div class="row"><div class="card">${renderCard(i)}</div><div class="rb"><button class="b a" data-a="apr" data-id="${i.id}">Aprovar</button><button class="b d" data-a="rec" data-id="${i.id}">Recusar</button></div></div>`).join('')}else if(at==='prem'){c.innerHTML=reqs.map(r=>{const usr=D.u.find(a=>a.id===r.uid);return `<div class="row"><div><strong>${usr?.nome}</strong><br>${usr?.tel}<br>R$ ${r.m*25}</div><div class="rb"><button class="b a" data-a="ativ" data-id="${r.id}">Ativar Premium</button></div></div>`}).join('')}else if(at==='users'){c.innerHTML=`<div class="tw"><table><tr><th>Nome</th><th>E-mail</th><th>WhatsApp</th><th>Premium</th><th>Bloqueado</th></tr>${D.u.map(u=>`<tr><td>${u.nome}</td><td>${u.email}</td><td><a href="${wa(u.tel,'Olá!')}">${u.tel}</a></td><td>${u.ate>Date.now()?fd(u.ate):'—'}</td><td><button class="b ${u.bl?'d':'s'}" data-a="blk" data-id="${u.id}">${u.bl?'Desbloquear':'Bloquear'}</button></td></tr>`).join('')}</table></div>`}else if(at==='msgs'){c.innerHTML=D.m.map(m=>`<div class="box"><strong>${m.nome}</strong><br><a href="mailto:${m.email}">${m.email}</a><p>${m.x}</p></div>`).join('')}}else if(route==='minhas'&&u){const pubs=D.i.filter(a=>a.uid===u.id);const ativas=pubs.filter(p=>!p.exp||p.exp>Date.now());const inativas=pubs.filter(p=>p.exp&&p.exp<=Date.now());r.innerHTML=`<section class="w"><h2>Minhas Publicações</h2>${ativas.length?`<h3>Ativas (${ativas.length})</h3><div class="g">${ativas.map(p=>`<div>${renderCard(p)}<div style="padding:0 8px"><button class="b s" style="width:48%" data-a="edt" data-id="${p.id}">Editar</button><button class="b d" style="width:48%" data-a="del2" data-id="${p.id}">Excluir</button></div></div>`).join('')}</div>`:''}${inativas.length?`<h3 style="margin-top:20px">Inativas (${inativas.length})</h3><div class="g">${inativas.map(p=>`<div>${renderCard(p)}<div style="padding:0 8px"><button class="b s" style="width:100%" data-a="rep" data-id="${p.id}">Repostar</button></div></div>`).join('')}</div>`:''}${!pubs.length?'<p>Você ainda não publicou nada.</p>':''}</section>`;}else if(route==='contato'){r.innerHTML=`<section class="w"><h2>Fale Conosco</h2><div style="display:grid;gap:20px;grid-template-columns:1fr 1fr"><div><h3>Quer ser Premium?</h3><p>Quer ser Premium ou tem alguma dúvida? Entre em contato conosco através dos canais abaixo:</p><button class="b a" onclick="window.open('${wa('47992928049','Olá! Quero saber mais sobre o plano Premium.')}','_blank')">Nos chame no WhatsApp</button><button class="b s" onclick="window.open('mailto:conectasantaregina@gmail.com?subject=Interesse em Premium','_blank')">Envie um e-mail</button></div><div><div class="box"><h3>Sobre o Conecta Santa Regina</h3><p>O que é? Um espaço digital feito por moradores, para moradores do bairro Santa Regina.</p><p><strong>Perfil Grátis</strong><br>✓ Qualquer morador pode usar<br>✓ Cadastrar comércios, serviços, vagas, imóveis, melhorias e doações<br>✓ Visualizar tudo que é publicado<br>✓ Sem custos</p><p><strong>Perfil Premium</strong><br>✓ Para comerciantes e prestadores de serviços<br>✓ Publicar no Feed e Novidades<br>✓ Maior visibilidade<br>✓ Taxa mensal: R$ 25,00<br><small><em>Todas as publicações estarão sujeitas a aprovação do administrador.</em></small></p></div></div></div></section>`;}else if(route.startsWith('novidades')||route==='feed'){if(!u||!u.ate||u.ate<=Date.now()){r.innerHTML=`<section class="w"><div class="box" style="text-align:center"><h2>Conteúdo Premium 🔒</h2><p>Faça upgrade para acessar ${route==='novidades'?'Novidades':'Feed Premium'}</p><button class="b a" onclick="this.parentElement.parentElement.innerHTML='<form data-f=\\'prem\\'><h2>Solicitar Premium</h2><label>Nome <input name=\\'nome\\' value=\\'' + (me()?.nome||'') + '\\' required></label><label>Contato <input name=\\'contato\\' value=\\'' + (me()?.tel||'') + '\\' required></label><label>Meses <select name=\\'m\\' required><option>1</option><option>3</option><option>6</option><option>12</option></select></label><button class=\\'b a\\'>Solicitar</button></form>'">Ativar Premium</button></div></section>`;}else{const list=ok(route==='novidades'?'novidades':'feed');if(!list.length){r.innerHTML=`<section class="w"><p>Nenhuma publicação ainda.</p></section>`;return}const news=list.slice(0,5);if(route==='novidades'&&news.length){const n=news[si%news.length];r.innerHTML=`<section class="w"><div class="carousel-wrapper"><div class="carousel-image-side"><img src="${n.img}" class="carousel-image"></div><div class="carousel-info" onclick="location.hash='/novidades'"><h3>${n.t}</h3><p>${n.x}</p><small>${fd(n.w)}${n.e?` • <a href="${n.e}" target="_blank">Saiba mais</a>`:''}</small><div class="carousel-dots">${news.map((o,j)=>`<button class="dot ${j===si%news.length?'active':''}" data-a="ngoto" data-id="${j}"></button>`).join('')}</div></div><button class="carousel-nav prev" data-a="nnav" data-d="-1">‹</button><button class="carousel-nav next" data-a="nnav" data-d="1">›</button></div><h2 style="margin-top:32px">Todas as Novidades</h2></section>`;}r.innerHTML+=`<section class="w"><div class="g">${list.map(renderCard).join('')}</div></section>`;};}else{const list=ok(route);r.innerHTML=`<section class="w"><h2>${cats[route]||route}</h2><div class="g">${list.map(renderCard).join('')}</div></section>`;}$$('[data-a]').forEach(e=>e.onclick=function(ev){ev.preventDefault();const act=this.dataset.a,id=this.dataset.id;const A={viz:()=>{const p=D.i.find(a=>a.id===id);if(!p)return;dlg.querySelector('.mp').innerHTML=`<button class="cl" onclick="dlg.close()">✕</button><h2>${p.t}</h2><p style="color:var(--mut)">${cats[p.cat]} • ${fd(p.w)}</p><img src="${p.img}" style="width:100%;max-height:60vh;object-fit:contain;border-radius:8px"><p style="margin:16px 0;white-space:pre-line">${p.x}</p>${p.e?`<p><a href="${p.e}" class="b a" target="_blank">Saiba mais em: ${p.e}</a></p>`:''}`;dlg.showModal()},pub:()=>{const c=route==='novidades'?'novidades':route==='feed'?'feed':route;openPost(c)},edt:()=>{openPost(D.i.find(a=>a.id===id).cat,id)},del2:()=>{D.i=D.i.filter(a=>a.id!==id);save();view()},rep:()=>{const pub=D.i.find(a=>a.id===id);if(!pub)return;openPost(pub.cat,id)},apr:()=>{D.i.find(a=>a.id===id).st='o';save();view()},rec:()=>{D.i.find(a=>a.id===id).st='r';save();view()},blk:()=>{const x=D.u.find(a=>a.id===id);x.bl=x.bl?0:1;save();view()},ativ:()=>{const r=D.r.find(a=>a.id===id),x=D.u.find(a=>a.id===r.uid);x.ate=Math.max(Date.now(),x.ate||0)+r.m*30*864e5;r.st='o';save();view();toast('Premium ativo até '+fd(x.ate)+'. Avise a pessoa pelo WhatsApp.');window.open(wa(x.tel,`Olá, ${x.nome}! Pagamento confirmado: seu perfil Premium está ativo até ${fd(x.ate)}.`),'_blank','noopener')},tab:()=>{at=this.dataset.t;view()},ent:()=>to('/entrar'),sai:()=>{D.s=null;save();view();to('')},adm:()=>to('/admin'),nnav:()=>{clearTimeout(window.autoCarousel);const n=ok('novidades');if(!n||n.length<2)return;si=(si+ +this.dataset.d+n.length)%n.length;view();window.autoCarousel=setTimeout(startAutoCarousel,5000)},ngoto:()=>{clearTimeout(window.autoCarousel);si=+this.dataset.id;view();window.autoCarousel=setTimeout(startAutoCarousel,5000)}};A[act]?.();});}
function startAutoCarousel(){const n=ok('novidades');if(!n||n.length<2)return;si=(si+1)%n.length;view();window.autoCarousel=setTimeout(startAutoCarousel,5000)}
document.addEventListener('submit',async e=>{e.preventDefault();const F=e.target,f=F.dataset.f,v=Object.fromEntries(new FormData(F)),u=me();if(f==='in'){const p=await hs(v.senha);const x=D.u.find(a=>a.email===v.email.trim().toLowerCase()&&a.senha===p);if(!x)return toast('E-mail ou senha incorretos.');if(x.bl)return toast('Conta bloqueada. Fale com a administração.');D.s=x.id;save();return to('')}if(f==='up'){const em=v.email.trim().toLowerCase();if(D.u.some(a=>a.email===em))return toast('Este e-mail já tem conta. Use a aba Entrar.');const x={id:uid(),nome:v.nome.trim(),email:em,tel:v.tel.trim(),senha:await hs(v.senha),role:em===ADMIN?'admin':'user',ate:0,bl:0};D.u.push(x);D.s=x.id;await saveToSupabase('usuarios','insert',x);toast('Conta criada!');return to('')}if(f==='post'){const ad=isAdm(u),i=v.id&&D.i.find(a=>a.id===v.id),dias=+v.dias||0,exp=dias?Date.now()+dias*864e5:0;if(i){i.t=v.t;i.x=v.x;i.e=v.e;i.exp=exp;i.duracao=dias;i.st=ad?'o':'p';await saveToSupabase('publicacoes','update',i);}else{const p={id:uid(),cat:v.cat,uid:u.id,t:v.t,x:v.x,e:v.e,img:null,w:Date.now(),exp,st:ad?'o':'p',duracao:dias};D.i.push(p);await saveToSupabase('publicacoes','insert',p);}save();dlg.close();toast(ad?'Publicado.':'Enviado! Aparece depois da aprovação da administração.');return view()}if(f==='prem'){D.r.push({id:uid(),uid:u.id,nome:v.nome,contato:v.contato,m:+v.m,st:'p',w:Date.now()});await saveToSupabase('solicitar_premium','insert',{id:D.r[D.r.length-1].id,uid:u.id,nome:v.nome,contato:v.contato,m:+v.m,st:'p'});save();dlg.close();toast('Pedido enviado! A administração vai chamar você no WhatsApp.');view()}});
